const ouverts = j => (S.dispos[j] !== undefined) ? S.dispos[j] : creneauxDef(new Date(...j.split('-').map((v,i)=>i===1?+v-1:+v)));

/* ============ DONNÉES ============ */
async function chargerPrestations(){
  const {data,error}=await sb.from('prestations').select('*').eq('actif',true).order('ordre');
  if(!error) S.prestations=data||[];
}
async function chargerDispos(){
  const {data}=await sb.from('disponibilites').select('*').gte('jour',iso(new Date()));
  S.dispos={}; (data||[]).forEach(d=>S.dispos[d.jour]=d.creneaux||[]);
}
async function chargerRdvs(){
  if(!S.user){S.rdvs=[];return;}
  const {data}=await sb.from('rendez_vous').select('*').order('jour').order('heure');
  S.rdvs=data||[];
}
async function chargerClientes(){
  const {data}=await sb.from('profils').select('*').order('cree_le',{ascending:false});
  S.clientes=data||[];
}
async function chargerPris(j){
  const {data}=await sb.rpc('creneaux_pris',{p_jour:j});
  S.prisCache[j]=(data||[]).map(r=>r.heure);
}
async function chargerProfil(){
  if(!S.user){S.profil=null;return;}
  const {data}=await sb.from('profils').select('*').eq('id',S.user.id).maybeSingle();
  S.profil=data||null;
  if(data){ S.form={nom:data.nom||'',tel:data.tel||'',email:data.email||''}; }
}
const estAdmin = () => S.profil && S.profil.role==='admin';

async function initialiser(){
  const {data:{session}}=await sb.auth.getSession();
  S.user=session?.user||null;
  await Promise.all([chargerPrestations(),chargerDispos()]);
  await chargerProfil();
  if(S.user) await chargerRdvs();
  S.pret=true; rendre();
}
sb.auth.onAuthStateChange(async (_e,session)=>{
  const avant=S.user?.id;
  S.user=session?.user||null;
  if(S.user?.id!==avant){
    await chargerProfil(); await chargerRdvs(); await chargerDispos();
    S.tab = estAdmin() ? 'agenda' : 'reserver';
    S.vue = estAdmin() ? 'admin' : 'client';
    rendre();
  }
});

/* ============ RENDU ============ */
const app=document.getElementById('app');
function rendre(){
  if(!S.pret){app.innerHTML='<div class="load">Chargement…</div>';return;}
  let h = entete();
  if(!S.user){ h += vuePublique(); }
  else if(S.vue==='admin' && estAdmin()){ h += vueAdmin(); }
  else { h += vueCliente(); }
  app.innerHTML=h;
  brancher();
}

function entete(){
  let h=`<div class="hero">
    <img class="mono" src="logo.png" alt="Mariame A." onerror="this.style.display='none'">

    <div class="lieu">Esthéticienne — Dakar Plateau</div>

  if(S.user && estAdmin()){
    h+=`<div class="switch">
      <button class="${S.vue==='client'?'on':''}" data-vue="client">Vue cliente</button>
      <button class="${S.vue==='admin'?'on':''}" data-vue="admin">Espace Mariame</button>
    </div>`;
  }
  return h;
}

  <div class="field"><label>Nom et prénom</label><input id="f_nom" value="${esc(S.form.nom)}" placeholder="Votre nom"></div>

      const rappel=waLien(r.client_tel,`Bonjour ${r.client_nom}, petit rappel : nous avons rendez-vous ${libDate(r.jour)} à ${r.heure} pour « ${p?p.nom:'votre soin'} ». À demain ! Mariame — Salon Podium`);
      return `<div class="card" style="cursor:default"><div class="row">
        <div><div class="nm">${r.heure} · ${esc(p?.nom||'')}</div>
        <div class="meta">${esc(r.client_nom)} · ${esc(r.client_tel)}</div></div>
        <span class="pill ${r.mode_paiement!=='place'?'ok':''}">${r.mode_paiement==='place'?'Sur place':'Acompte'}</span>
      </div>
      <div class="row" style="margin-top:11px">
        <a class="btn sm ghost" href="${rappel}" target="_blank" rel="noreferrer">Envoyer un rappel</a>
        <a class="btn sm ghost" href="tel:+221${String(r.client_tel).replace(/\D/g,'').replace(/^221/,'')}">Appeler</a>
      </div></div>`;}).join('')
     :`<div class="empty"><div class="disp">Journée libre</div><p>Aucun rendez-vous confirmé le ${libDate(S.jourAdmin)}.</p></div>`);
}

function adminDemandes(){
  const att=S.rdvs.filter(r=>r.statut==='attente');
  if(!att.length) return `<div class="stitle">Demandes</div>
    <div class="empty"><div class="disp">Tout est à jour</div><p>Les nouvelles demandes arriveront ici.</p></div>`;
  return `<div class="stitle">Demandes à traiter</div>`+att.map(r=>{
    const p=S.prestations.find(x=>x.id===r.prestation_id);
    return `<div class="card" style="cursor:default">
      <div class="row"><div class="nm">${esc(p?.nom||'')}</div>
        <span class="pill ${r.mode_paiement!=='place'?'ok':'attente'}">${r.mode_paiement==='place'?'Sur place':'Acompte'}</span></div>
      <div class="meta">${libDate(r.jour)} · ${r.heure}</div>
      <div class="meta">${esc(r.client_nom)} · ${esc(r.client_tel)}</div>
      ${r.ref_transaction?`<div class="meta">Transaction : ${esc(r.ref_transaction)}</div>`:''}
      <div class="row" style="margin-top:13px">
        <button class="btn sm" data-conf="${r.id}">Confirmer</button>
        <button class="btn sm rose" data-ref="${r.id}">Refuser</button>
        <a class="btn sm ghost" href="https://wa.me/221${String(r.client_tel).replace(/\D/g,'').replace(/^221/,'')}" target="_blank">WhatsApp</a>
      </div></div>`;}).join('');
}

function adminDispos(){
  const o=ouverts(S.jourAdmin);
  return `<div class="stitle">Mes disponibilités</div>
    <p class="hint" style="margin-bottom:14px">Ouvrez ou fermez une journée, puis retirez les heures déjà prises. Les clientes ne voient que ce qui reste.</p>
    <div class="strip">`+JOURS_LISTE.slice(0,14).map(d=>{const s=iso(d);
      return `<button class="day ${S.jourAdmin===s?'sel':''}" data-jadmin="${s}">
        <div class="a">${JOURS[d.getDay()]}</div><div class="b">${d.getDate()}</div>
        <div class="c">${ouverts(s).length?ouverts(s).length+'h':'fermé'}</div></button>`;}).join('')+
    `</div><div class="row" style="margin:4px 0 14px">
      <span class="hint">${libDate(S.jourAdmin)}</span>
      <button class="btn sm ghost" id="togglejour">${o.length?'Fermer la journée':'Ouvrir la journée'}</button>
    </div><div class="slots">`+
    TOUS_CRENEAUX.map(h=>`<button class="slot ${o.includes(h)?'sel':''}" data-cr="${h}">${h}</button>`).join('')+`</div>`;
}

function adminClientes(){
  if(!S.clientes.length) return `<div class="stitle">Fichier clientes</div>
    <div class="empty"><div class="disp">Fichier vide</div><p>Chaque cliente qui crée un compte apparaît ici.</p></div>`;
  return `<div class="stitle">Fichier clientes</div>`+S.clientes.map(c=>{
    const n=S.rdvs.filter(r=>r.client_id===c.id).length;
    const tel=String(c.tel||'').replace(/\D/g,'').replace(/^221/,'');
    return `<div class="card" style="cursor:default"><div class="row">
      <div><div class="nm">${esc(c.nom||'Sans nom')}</div>
      <div class="meta">${esc(c.tel||'—')}${c.email?' · '+esc(c.email):''}</div>
      <div class="meta">${n} rendez-vous</div></div>
      ${tel?`<a class="btn sm ghost" href="https://wa.me/221${tel}" target="_blank">WhatsApp</a>`:''}
    </div></div>`;}).join('')+
    `<button class="btn ghost" id="deconnexion">Se déconnecter</button>`;
}

function adminTarifs(){
  return `<div class="stitle">Prestations et tarifs</div>
    <p class="hint" style="margin-bottom:12px">Touchez une ligne pour corriger le prix et la durée. Les modifications sont enregistrées dans la base.</p>`+
    CATS.map(c=>`<div class="stitle">${c.nom}</div>`+
      S.prestations.filter(p=>p.categorie===c.id).map(p=>`
      <div class="card" data-edit="${p.id}">
        <span class="prix">${fcfa(p.prix_fcfa)||'sur devis'}</span>
        <div class="nm">${esc(p.nom)}</div>
        <div class="meta">${p.duree_min?p.duree_min+' min':'durée variable'}</div>
        ${S.edit===p.id?`<div style="margin-top:14px" data-stop="1">
          <div class="field"><label>Prix en FCFA</label><input id="e_prix" inputmode="numeric" value="${p.prix_fcfa??''}" placeholder="ex. 5000"></div>
          <div class="field"><label>Durée en minutes</label><input id="e_duree" inputmode="numeric" value="${p.duree_min??''}" placeholder="ex. 20"></div>
          <button class="btn sm" data-save="${p.id}">Enregistrer</button>
        </div>`:''}
      </div>`).join('')).join('');
}

/* ---------- BARRE D'ONGLETS ---------- */
const IC={
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  coeur:'<path d="M12 20s-7-4.4-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.6-7 9-7 9z"/>',
  lieu:'<path d="M12 21s7-5.6 7-11a7 7 0 10-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  cloche:'<path d="M18 15V10a6 6 0 10-12 0v5l-2 3h16l-2-3z"/><path d="M10 21h4"/>',
  horloge:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  etiquette:'<path d="M3 12V5a2 2 0 012-2h7l9 9-9 9-9-9z"/><circle cx="8" cy="8" r="1.4"/>'
};
const barre = items => `<nav class="tabs">`+items.map(([k,l,i])=>
  `<button class="${S.tab===k?'on':''}" data-tab="${k}"><svg viewBox="0 0 24 24">${IC[i]}</svg>${l}</button>`).join('')+`</nav>`;

/* ============ INTERACTIONS ============ */
function lire(id){ const e=document.getElementById(id); return e?e.value:''; }

function brancher(){
  document.querySelectorAll('[data-copie]').forEach(b=>b.onclick=async()=>{
    try{ await navigator.clipboard.writeText(b.dataset.copie); toast('Copié'); }
    catch(e){ toast('Sélectionnez le texte pour le copier',true); }
  });
  const qr=document.getElementById('qr');
  if(qr && window.QRCode){
    qr.innerHTML='';
    new QRCode(qr,{text:SITE,width:220,height:220,
      colorDark:'#2A1226',colorLight:'#FBF2E9',correctLevel:QRCode.CorrectLevel.M});
  }

  document.querySelectorAll('[data-tabpub]').forEach(b=>b.onclick=()=>{
    S.tabPub=b.dataset.tabpub; window.scrollTo(0,0); rendre();
  });
  document.querySelectorAll('[data-vue]').forEach(b=>b.onclick=()=>{
    S.vue=b.dataset.vue; S.tab=S.vue==='admin'?'agenda':'reserver';
    if(S.vue==='admin') chargerClientes().then(rendre); else rendre();
  });
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{
    S.tab=b.dataset.tab;
    if(S.tab==='clientes') await chargerClientes();
    if(S.tab==='mesrdv'||S.tab==='agenda'||S.tab==='demandes') await chargerRdvs();
    rendre();
  });

  // authentification
  const go=document.getElementById('a_go');
  if(go) go.onclick=authentifier;
  const bas=document.getElementById('a_bascule');
  if(bas) bas.onclick=()=>{ memoAuth(); S.authMode=S.authMode==='connexion'?'inscription':'connexion'; rendre(); };

  const dec=document.getElementById('deconnexion');
  if(dec) dec.onclick=async()=>{ await sb.auth.signOut(); S.profil=null; S.rdvs=[]; S.vue='client'; S.tab='reserver'; rendre(); };

  // parcours de réservation
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;rendre();});
  document.querySelectorAll('[data-presta]').forEach(b=>b.onclick=()=>{S.choix=b.dataset.presta;S.etape=1;rendre();});
  document.querySelectorAll('[data-jour]').forEach(b=>b.onclick=async()=>{
    S.jour=b.dataset.jour; S.heure=null; await chargerPris(S.jour); S.etape=2; rendre();
  });
  document.querySelectorAll('[data-heure]').forEach(b=>b.onclick=()=>{S.heure=b.dataset.heure;S.etape=3;rendre();});
  document.querySelectorAll('[data-moyen]').forEach(b=>b.onclick=()=>{memoForm();S.moyen=b.dataset.moyen;rendre();});
  document.querySelectorAll('[data-retour]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.retour;
    if(v==='cat'){S.cat=null;} else {S.etape=Number(v);}
    rendre();
  });
  const val=document.getElementById('valider');
  if(val) val.onclick=reserver;

  document.querySelectorAll('[data-fermewa]').forEach(b=>b.onclick=()=>{S.msgWA=null;rendre();});
  document.querySelectorAll('[data-annule]').forEach(b=>b.onclick=()=>annuler(b.dataset.annule));

  // administration
  document.querySelectorAll('[data-jadmin]').forEach(b=>b.onclick=()=>{S.jourAdmin=b.dataset.jadmin;rendre();});
  document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>statuer(b.dataset.conf,'confirme'));
  document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>statuer(b.dataset.ref,'refuse'));
  const tj=document.getElementById('togglejour');
  if(tj) tj.onclick=basculerJour;
  document.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>basculerCreneau(b.dataset.cr));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{
    if(e.target.closest('[data-stop]')) return;
    S.edit = S.edit===b.dataset.edit ? null : b.dataset.edit; rendre();
  });
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();sauverTarif(b.dataset.save);});
}

function memoAuth(){
  S.auth={email:lire('a_email')||S.auth.email, mdp:lire('a_mdp')||S.auth.mdp,
          nom:lire('a_nom')||S.auth.nom, tel:lire('a_tel')||S.auth.tel};
}
function memoForm(){
  const n=lire('f_nom'), t=lire('f_tel'), r=lire('f_ref');
  if(n!=='')S.form.nom=n; if(t!=='')S.form.tel=t; if(r!=='')S.ref=r;
}

async function authentifier(){
  memoAuth();
  const {email,mdp,nom,tel}=S.auth;
  if(!email||!mdp) return toast('Email et mot de passe requis',true);
  if(S.authMode==='inscription' && (!nom||!tel)) return toast('Nom et téléphone requis',true);
  S.busy=true; rendre();
  let error;
  if(S.authMode==='connexion'){
    ({error}=await sb.auth.signInWithPassword({email,password:mdp}));
  } else {
    ({error}=await sb.auth.signUp({email,password:mdp,options:{data:{nom,tel}}}));
  }
  S.busy=false;
  if(error){ rendre(); return toast(traduire(error.message),true); }
  S.auth={email:'',mdp:'',nom:'',tel:''};
  toast(S.authMode==='connexion'?'Bienvenue':'Compte créé');
}
function traduire(m){
  if(/Invalid login/i.test(m)) return 'Email ou mot de passe incorrect';
  if(/already registered/i.test(m)) return 'Un compte existe déjà avec cet email';
  if(/at least 6/i.test(m)) return 'Mot de passe : 6 caractères minimum';
  if(/valid email/i.test(m)) return 'Adresse email invalide';
  return m;
}

async function reserver(){
  memoForm();
  if(!S.form.nom||!S.form.tel) return toast('Nom et téléphone requis',true);
  if(S.moyen!=='place' && !S.ref) return toast('Numéro de transaction requis',true);
  S.busy=true; rendre();
  const {error}=await sb.from('rendez_vous').insert({
    client_id:S.user.id, prestation_id:S.choix, jour:S.jour, heure:S.heure,
    client_nom:S.form.nom, client_tel:S.form.tel, client_email:S.user.email,
    mode_paiement:S.moyen, ref_transaction:S.moyen==='place'?null:S.ref, statut:'attente'
  });
  S.busy=false;
  if(error){
    if(error.code==='23505'){ await chargerPris(S.jour); S.etape=2; rendre(); return toast('Ce créneau vient d\'être pris',true); }
    rendre(); return toast('Erreur : '+error.message,true);
  }
  await sb.from('profils').update({nom:S.form.nom,tel:S.form.tel}).eq('id',S.user.id);
  const pr=S.prestations.find(x=>x.id===S.choix);
  const detail=`Bonjour Mariame, je viens de réserver « ${pr?pr.nom:''} » le ${libDate(S.jour)} à ${S.heure}. ${S.moyen==='place'?'Je réglerai sur place.':'J\'ai envoyé l\'acompte, référence '+S.ref+'.'} ${S.form.nom}`;
  S.msgWA={lien:waLien(WA,detail), nom:'Mariame', titre:'Prévenir Mariame'};
  await chargerRdvs(); await chargerProfil();
  S.etape=0;S.cat=null;S.choix=null;S.jour=null;S.heure=null;S.ref='';S.tab='mesrdv';
  rendre(); toast('Demande envoyée à Mariame');
}

async function annuler(id){
  const r=S.rdvs.find(x=>x.id===id);
  const {error}=await sb.from('rendez_vous').update({statut:'annule'}).eq('id',id);
  if(error) return toast('Erreur : '+error.message,true);
  if(r){
    const p=S.prestations.find(x=>x.id===r.prestation_id);
    const texte=`Bonjour Mariame, je dois annuler mon rendez-vous « ${p?p.nom:''} » du ${libDate(r.jour)} à ${r.heure}. Désolée pour le dérangement. ${r.client_nom}`;
    S.msgWA={lien:waLien(WA,texte), nom:'Mariame', titre:'Prévenir Mariame de l\'annulation'};
  }
  await chargerRdvs(); rendre(); toast('Rendez-vous annulé');
}

async function statuer(id,statut){
  const r=S.rdvs.find(x=>x.id===id);
  const {error}=await sb.from('rendez_vous').update({statut}).eq('id',id);
  if(error) return toast('Erreur : '+error.message,true);
  if(r){
    const p=S.prestations.find(x=>x.id===r.presta||x.id===r.prestation_id);
    const soin=p?p.nom:'votre soin';
    const quand=`${libDate(r.jour)} à ${r.heure}`;
    const texte = statut==='confirme'
      ? `Bonjour ${r.client_nom}, votre rendez-vous pour « ${soin} » le ${quand} est confirmé. Je vous attends au Salon Podium, 60 rue Jules Ferry, Dakar Plateau. À très vite ! Mariame`
      : `Bonjour ${r.client_nom}, je ne peux malheureusement pas honorer le créneau du ${quand}. Dites-moi un autre moment qui vous arrange et je vous réserve une place. Mariame`;
    S.msgWA={lien:waLien(r.client_tel,texte), nom:r.client_nom,
             titre:statut==='confirme'?'Prévenir la cliente':'Proposer un autre créneau'};
  }
  await chargerRdvs(); rendre();
  toast(statut==='confirme'?'Rendez-vous confirmé':'Rendez-vous refusé');
}

async function basculerJour(){
  const j=S.jourAdmin, a=ouverts(j);
  const [y,m,d]=j.split('-').map(Number);
  const def=creneauxDef(new Date(y,m-1,d));
  const nouveaux = a.length ? [] : (def.length?def:TOUS_CRENEAUX);
  const {error}=await sb.from('disponibilites').upsert({jour:j,creneaux:nouveaux});
  if(error) return toast('Erreur : '+error.message,true);
  S.dispos[j]=nouveaux; rendre();
}
async function basculerCreneau(h){
  const j=S.jourAdmin, a=ouverts(j);
  const n = a.includes(h) ? a.filter(x=>x!==h) : [...a,h].sort();
  const {error}=await sb.from('disponibilites').upsert({jour:j,creneaux:n});
  if(error) return toast('Erreur : '+error.message,true);
  S.dispos[j]=n; rendre();
}

async function sauverTarif(id){
  const prix=lire('e_prix'), duree=lire('e_duree');
  const {error}=await sb.from('prestations').update({
    prix_fcfa: prix===''?null:Number(prix),
    duree_min: duree===''?null:Number(duree)
  }).eq('id',id);
  if(error) return toast('Erreur : '+error.message,true);
  await chargerPrestations(); S.edit=null; rendre(); toast('Tarif enregistré');
}

initialiser();
</script>
